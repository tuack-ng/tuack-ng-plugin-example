name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: 构建 wasm
        run: cargo build --target wasm32-wasip1 --release
      - name: 打包（plugin.toml + entry）
        run: |
          mkdir -p dist
          cp plugin.toml dist/
          cp target/wasm32-wasip1/release/tuack_ng_plugin_example.wasm dist/example.wasm
          (cd dist && zip -r ../example.zip .)
          unzip -l example.zip
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: example.zip
